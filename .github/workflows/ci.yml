name: pnpm CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Generate TypeChain artifacts
        run: pnpm exec typechain --target ethers-v5 --out-dir src/typechain src/abi/*.json

      - name: Run build
        run: pnpm run build

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Generate TypeChain artifacts
        run: pnpm exec typechain --target ethers-v5 --out-dir src/typechain src/abi/*.json

      - name: Run test
        run: pnpm run test
