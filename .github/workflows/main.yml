name: Unit Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test-base:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout front end code.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.base_ref}}

      - name: Bootstrap
        uses: ./.github/actions/bootstrap
      - name: Generate TypeChain artifacts
        run: pnpm exec typechain --target ethers-v5 --out-dir src/typechain src/abi/*.json
      - name: Run unit tests
        run: pnpm test:unit --coverage.reporter=json --outputFile=base-report.json && node ./scripts/fix-coverage-report.js --outputFile base-report.json
      - name: Upload Report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: base-report
          path: base-report.json
  test-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout front end code.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref}}

      - name: Bootstrap
        uses: ./.github/actions/bootstrap
      - name: Generate TypeChain artifacts
        run: pnpm exec typechain --target ethers-v5 --out-dir src/typechain src/abi/*.json
      - name: Run unit tests
        run: pnpm test:unit --coverage.reporter=json --outputFile=branch-report.json && node ./scripts/fix-coverage-report.js --outputFile branch-report.json
      - name: Upload Report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: branch-report
          path: branch-report.json
  coverageReport:
    runs-on: ubuntu-latest
    needs: [test-base, test-branch]
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Download Base Report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: base-report
      - name: Download Branch Report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: branch-report
      - name: Generate Coverage Report
        uses: ArtiomTr/jest-coverage-report-action@7f750dd50f5585533321eb7ebc482b936b49a5d4 # v2
        with:
          test-script: pnpm test:unit
          package-manager: pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}
          coverage-file: branch-report.json
          base-coverage-file: base-report.json
          annotations: all
